<!-- This line tells the browser that this document uses HTML5. -->
<!DOCTYPE html>

<!-- This opening tag starts the HTML document and specifies that the language is English. -->
<html lang="en">

<!-- The head section contains information about the webpage that is not displayed directly on the page. -->
<head>

    <!-- This line sets the character encoding so text displays correctly. -->
    <meta charset="UTF-8">

    <!-- This line makes the webpage responsive on different screen sizes and devices. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- This line sets the title that appears in the browser tab. -->
    <title>My First Web Page</title>

<!-- This closing tag ends the head section. -->
</head>

<!-- This opening tag starts the body, which contains the content displayed on the webpage. -->
<body>

    <!-- This heading displays the title of the webpage. -->
    <h1>My First Web Page</h1>

    <!-- This paragraph displays the username. -->
    <p><strong>Username:</strong> ep396</p>

    <!-- This paragraph displays the course name. -->
    <p><strong>Course Name:</strong> IS117</p>

    <!-- This paragraph displays the course number. -->
    <p><strong>Course Number:</strong> IS117</p>

    <!-- This paragraph displays the course section. -->
    <p><strong>Section:</strong> 001</p>

    <!-- This horizontal line visually separates the main content from the footer. -->
    <hr>

    <!-- This footer contains copyright information, the student's name, and the due date. -->
    <footer>

        <!-- This paragraph displays the copyright symbol, student's name, and assignment due date. -->
        <p>&copy; 2026 Erik Preisner | Due Date: 10/9/2026</p>

    <!-- This closing tag ends the footer section. -->
    </footer>

<!-- This closing tag ends the body of the webpage. -->
</body>

<!-- This closing tag ends the HTML document. -->
</html>
